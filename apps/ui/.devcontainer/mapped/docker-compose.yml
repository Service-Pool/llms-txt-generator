name: ${COMPOSE_PROJECT_NAME}

services:
  caddy:
    image: ${COMPOSE_PROJECT_NAME}-caddy
    hostname: caddy
    container_name: ${COMPOSE_PROJECT_NAME}-Caddy
    build:
      context: ..
      dockerfile: Dockerfile.caddy
    working_dir: /srv
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ../_configs/Caddyfile:/tmp/Caddyfile
      - ./cmd-caddy.sh:/tmp/app/cmd-caddy.sh
    ports:
      - ${PORT_PROXY}:${PORT_PROXY}
    depends_on:
      llms-txt-generator-ui:
        condition: service_healthy
    networks:
      # app-network to reach the ui app privately; npm-network so NPM proxies it.
      app-network:
      npm-network:

  llms-txt-generator-ui:
    image: ${COMPOSE_PROJECT_NAME}-app
    hostname: app
    container_name: ${COMPOSE_PROJECT_NAME}-App
    build:
      context: ..
      dockerfile: Dockerfile.app
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    working_dir: /app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ../../:/app
      - ../../../api/src:/api/src
      - ./cmd-llms-txt-generator-ui.sh:/tmp/app/cmd-llms-txt-generator-ui.sh
      - /var/run/docker.sock:/var/run/docker.sock
      - node_modules:/app/node_modules
      - vite_cache:/app/node_modules/.vite
      - claude_data:/home/www-data/.claude
      - claude_cache:/home/www-data/.cache/claude
      - vscode_server:/home/www-data/.vscode-server
    # Ports are not exposed externally - Multivisor will connect via Docker network
    # - "9001:9001"  # Supervisor web UI (internal only)
    # - "9002:9002"  # Multivisor RPC (internal only)
    healthcheck:
      test: [ "CMD", "test", "-S", "/var/run/supervisor/supervisor.sock" ]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      # Project-private only — the `app` hostname would otherwise collide with the
      # api project's `app` on the shared npm-network. Caddy reaches it here; NPM
      # proxies via Caddy, so the app itself needn't be on npm-network.
      app-network:

volumes:
  node_modules:
  vite_cache:
  claude_data:
  claude_cache:
  vscode_server:

networks:
  app-network:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME}-network
  npm-network:
    external: true
