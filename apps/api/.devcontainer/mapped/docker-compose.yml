  mysql:
    image: ${COMPOSE_PROJECT_NAME}-mysql
    hostname: ${DB_HOST}
    container_name: ${COMPOSE_PROJECT_NAME}-MySQL
    build:
      context: ..
      dockerfile: Dockerfile.mysql
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    env_file:
      - .env
